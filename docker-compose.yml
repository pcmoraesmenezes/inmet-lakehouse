services:
  postgres:
    image: postgres:16-alpine
    container_name: inmet_pg
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: inmet_dw
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./work/csv_mg:/dados:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d inmet_dw"]
      interval: 5s
      retries: 10

  etl:
    build: .
    container_name: inmet_etl
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: inmet_sim
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./work/csv_mg:/app/work/csv_mg:ro

volumes:
  pgdata:
